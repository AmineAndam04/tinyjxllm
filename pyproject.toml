[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyjxllm"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "regex>=2026.9.29",
    "jax==0.12.0.1",
    "jaxlib==0.12.0.1",
    "jaxtyping==0.3.11",
    "einops==0.8.2",
    "tensorboardx==2.6.5",
    "wandb==0.31.0",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["tinyjxllm", "tinyjxllm.*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0402","B905","PLC0415"]
[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff]
line-length = 110
