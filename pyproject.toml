[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyjxllm"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinyjxllm", "tinyjxllm.*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0402","B905","PLC0415"]
[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff]
line-length = 110